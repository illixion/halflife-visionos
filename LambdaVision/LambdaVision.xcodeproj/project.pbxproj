			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "set -eu\nSRC=\"$SRCROOT/../HalfLifeAssets\"\nDEST=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GameData\"\nif [ ! -d \"$SRC/valve\" ]; then\n  echo \"warning: $SRC/valve not found — engine will boot without PAKs. See README.md (steam_legacy fetch).\"\n  exit 0\nfi\nmkdir -p \"$DEST\"\n# Bundle every top-level dir under HalfLifeAssets/ that looks like a\n# Half-Life gamedir (has liblist.gam or gameinfo.txt). This keeps mods\n# loadable (gearbox/, bshift/, czero/, custom HLDM mods, …) without\n# pulling in the macOS binaries Steam dropped at the top level.\nshopt -s nullglob\nfor d in \"$SRC\"/*/; do\n  name=$(basename \"$d\")\n  if [ -f \"$d/liblist.gam\" ] || [ -f \"$d/gameinfo.txt\" ]; then\n    rsync -a --delete --exclude '.DS_Store' \"$d\" \"$DEST/$name/\"\n    echo \"Bundled $name/ → $DEST/$name\"\n  fi\ndone\n";
		};
