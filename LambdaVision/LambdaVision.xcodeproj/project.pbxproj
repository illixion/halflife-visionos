		A55E0DA70001000000DA7A01 /* Bundle HalfLifeAssets */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Bundle HalfLifeAssets";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "set -eu\nSRC=\"$SRCROOT/../HalfLifeAssets\"\nDEST=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GameData\"\n# Assets ship out of band by default: pushed once to the app's\n# Documents/GameData with scripts/push-assets.sh, so a code rebuild\n# doesn't re-send ~450MB on every install. Opt back into a\n# self-contained bundle with BUNDLE_HL_ASSETS=1\n# (build-and-sign.sh --set BUNDLE_HL_ASSETS=1). Skipping must also DELETE any\n# GameData left in the incremental products dir, or a previously\n# bundled copy keeps shipping.\nif [ \"${BUNDLE_HL_ASSETS:-0}\" != \"1\" ]; then\n  if [ -d \"$DEST\" ]; then\n    rm -rf \"$DEST\"\n    echo \"Removed stale bundled GameData from build products\"\n  fi\n  echo \"Skipping asset bundling (assets ship via scripts/push-assets.sh)\"\n  exit 0\nfi\nif [ ! -d \"$SRC/valve\" ]; then\n  echo \"warning: $SRC/valve not found — engine will boot without PAKs. See README.md (steam_legacy fetch).\"\n  exit 0\nfi\nmkdir -p \"$DEST\"\n# Bundle every top-level dir under HalfLifeAssets/ that looks like a\n# Half-Life gamedir (has liblist.gam or gameinfo.txt). This keeps mods\n# loadable (gearbox/, bshift/, czero/, custom HLDM mods, …) without\n# pulling in the macOS binaries Steam dropped at the top level.\nshopt -s nullglob\nfor d in \"$SRC\"/*/; do\n  name=$(basename \"$d\")\n  case $name in *_hd|*_addon) overlay=1;; *) overlay=0;; esac\n  if [ -f \"$d/liblist.gam\" ] || [ -f \"$d/gameinfo.txt\" ] || [ \"$overlay\" = 1 ]; then\n    rsync -a --delete --exclude '.DS_Store' \"$d\" \"$DEST/$name/\"\n    echo \"Bundled $name/ → $DEST/$name\"\n  fi\ndone\n# SteamPipe overlay dirs (valve_hd HD models) mount via fs_mount_hd.\n# vfs.cfg is exec'd by the engine's FS_LoadGameInfo BEFORE the gamedir\n# mounts, so shipping it in the read-only gamedir enables HD content\n# with no engine changes. Skip if the assets tree ships its own.\nif [ -d \"$DEST/valve_hd\" ] && [ ! -f \"$SRC/valve/vfs.cfg\" ]; then\n  printf 'fs_mount_hd \"1\"\\n' > \"$DEST/valve/vfs.cfg\"\n  echo \"Wrote valve/vfs.cfg (fs_mount_hd 1)\"\nfi\n";
		};
/* End PBXShellScriptBuildPhase section */

