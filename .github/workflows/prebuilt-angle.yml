# Builds ANGLE (Metal backend, visionOS device + simulator) at the revision
# pinned in VisionPort/build_angle_visionos.sh and publishes libANGLE.a,
# libANGLE-sim.a and the public headers as a GitHub Release. The release tag
# is the content key from scripts/prebuilt-keys.sh (revision + hash of the
# patch, the build script and this workflow), which scripts/fetch-prebuilts.sh
# downloads by. A rerun whose key already has a release is a no-op; delete the
# release to force a rebuild.
name: Prebuilt ANGLE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prebuilt-angle
  cancel-in-progress: false

jobs:
  key:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.key.outputs.angle }}
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: ./scripts/prebuilt-keys.sh | tee -a "$GITHUB_OUTPUT"
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.key.outputs.angle }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG already exists; nothing to build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: key
    if: needs.key.outputs.exists != 'true'
    # macos-26 (Apple silicon) carries Xcode 26.x with the visionOS SDKs. Pin
    # one Xcode explicitly; changing it changes this file, and so the key.
    runs-on: macos-26
    timeout-minutes: 340
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TAG: ${{ needs.key.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Check toolchain
        run: |
          xcodebuild -version
          xcrun --sdk xros --show-sdk-path
          xcrun --sdk xrsimulator --show-sdk-path

      # The gclient sync is ~12 GiB plus two build trees. Drop the Xcodes and
      # simulator runtimes this job doesn't use (it builds against SDKs only).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /Applications/Xcode_26.0.1.app /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.2.app /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.4.1.app /Applications/Xcode_26.5.app \
            "$HOME/Library/Android"
          xcrun simctl runtime delete all || true
          df -h /

      - name: Build ANGLE
        run: ./VisionPort/build_angle_visionos.sh

      - name: Package
        working-directory: LambdaVision/Vendor/angle
        run: |
          tar -czf angle-include.tar.gz include
          shasum -a 256 libANGLE.a libANGLE-sim.a angle-include.tar.gz | tee SHA256SUMS

      - name: Publish release
        working-directory: LambdaVision/Vendor/angle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" libANGLE.a libANGLE-sim.a angle-include.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Prebuilt ANGLE ($TAG)" \
            --notes "ANGLE for visionOS (device + simulator), built by the Prebuilt ANGLE workflow from $GITHUB_SHA with $(xcodebuild -version | head -n 1). Fetched automatically by scripts/fetch-prebuilts.sh; the tag is a content key from scripts/prebuilt-keys.sh."
