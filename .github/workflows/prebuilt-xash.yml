# Builds libxash.a (device) and libxash-sim.a (simulator) from the xash3d-fwgs
# and hlsdk-portable revisions pinned in VisionPort/setup.sh plus our patches,
# then the built-in game ports as libgame-<gamedir>.a, and publishes them all
# as one GitHub Release. The tag is the content key from
# scripts/prebuilt-keys.sh (both pins + a hash of every engine input under
# VisionPort/ and this workflow), which scripts/fetch-prebuilts.sh downloads
# by. A run whose key already has a release is a no-op; delete the release to
# force a rebuild.
#
# Game ports are best-effort: each matrix entry may fail without failing the
# workflow or holding back the release, which then simply lacks that port.
name: Prebuilt libxash

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VisionPort/**'
      - '!VisionPort/angle-visionos.patch'
      - '!VisionPort/build_angle_visionos.sh'
      - '!VisionPort/build_xash_macos.sh'
      - '!VisionPort/build_xash_xrsim.sh'
      - 'scripts/prebuilt-keys.sh'
      - '.github/workflows/prebuilt-xash.yml'

permissions:
  contents: write

concurrency:
  group: prebuilt-xash
  cancel-in-progress: false

env:
  # macos-26 (Apple silicon) carries Xcode 26.x with the visionOS SDKs. Pin
  # one Xcode explicitly; changing it changes this file, and so the key.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  key:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.key.outputs.xash }}
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: ./scripts/prebuilt-keys.sh | tee -a "$GITHUB_OUTPUT"
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.key.outputs.xash }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG already exists; nothing to build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  engine:
    needs: key
    if: needs.key.outputs.exists != 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: llvm-objcopy
        run: |
          # The image ships Homebrew llvm@20 (unlinked); install llvm if not.
          prefix=$(brew --prefix llvm@20 2>/dev/null || true)
          if [[ ! -x "$prefix/bin/llvm-objcopy" ]]; then
            brew install llvm
            prefix=$(brew --prefix llvm)
          fi
          echo "LLVM_OBJCOPY=$prefix/bin/llvm-objcopy" >> "$GITHUB_ENV"
      - name: Check toolchain
        run: |
          xcodebuild -version
          xcrun --sdk xros --show-sdk-path
          "$LLVM_OBJCOPY" --version | head -n 2
      - name: Fetch and patch sources
        run: ./VisionPort/setup.sh
      - name: Build libxash.a (device)
        run: ./VisionPort/build_xash_libxash.sh
      - name: Build libxash-sim.a (simulator)
        run: XR_SIM=1 ./VisionPort/build_xash_libxash.sh
      - uses: actions/upload-artifact@v7
        with:
          name: libxash
          path: |
            LambdaVision/Vendor/libxash/libxash.a
            LambdaVision/Vendor/libxash/libxash-sim.a
          if-no-files-found: error

  # Built-in game ports, via the same VisionPort/build_game.sh a user runs for
  # their own mod (`build_game.sh <git-url-or-path> [branch]` writes
  # LambdaVision/Vendor/libxash/games/libgame-<gamedir>.a). Skips cleanly
  # while that script doesn't exist.
  games:
    needs: [key, engine]
    runs-on: macos-26
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: opfor
            title: Opposing Force
            url: https://github.com/FWGS/hlsdk-portable.git
            branch: opfor
          - name: bshift
            title: Blue Shift
            url: https://github.com/FWGS/hlsdk-portable.git
            branch: bshift
    name: game (${{ matrix.title }})
    steps:
      - uses: actions/checkout@v7
      - id: guard
        run: |
          if [[ -f VisionPort/build_game.sh ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VisionPort/build_game.sh not present yet; skipping ${{ matrix.title }}."
          fi
      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: llvm-objcopy
        if: steps.guard.outputs.run == 'true'
        run: |
          prefix=$(brew --prefix llvm@20 2>/dev/null || true)
          if [[ ! -x "$prefix/bin/llvm-objcopy" ]]; then
            brew install llvm
            prefix=$(brew --prefix llvm)
          fi
          # Only llvm-objcopy, never LLVM on PATH: build_game.sh compiles with
          # CC=clang, which must stay Apple's clang from the pinned Xcode.
          echo "LLVM_OBJCOPY=$prefix/bin/llvm-objcopy" >> "$GITHUB_ENV"
      - name: Fetch and patch sources
        if: steps.guard.outputs.run == 'true'
        run: ./VisionPort/setup.sh
      # The port links against this exact engine build.
      - if: steps.guard.outputs.run == 'true'
        uses: actions/download-artifact@v8
        with:
          name: libxash
          path: LambdaVision/Vendor/libxash
      - name: Build ${{ matrix.title }}
        if: steps.guard.outputs.run == 'true'
        env:
          GAME_URL: ${{ matrix.url }}
          GAME_BRANCH: ${{ matrix.branch }}
        run: ./VisionPort/build_game.sh "$GAME_URL" "$GAME_BRANCH"
      - name: Build ${{ matrix.title }} (simulator)
        if: steps.guard.outputs.run == 'true'
        env:
          GAME_URL: ${{ matrix.url }}
          GAME_BRANCH: ${{ matrix.branch }}
          XR_SIM: '1'
        run: ./VisionPort/build_game.sh "$GAME_URL" "$GAME_BRANCH"
      - if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: game-${{ matrix.name }}
          path: LambdaVision/Vendor/libxash/games/libgame-*.a
          if-no-files-found: warn

  publish:
    needs: [key, engine, games]
    # Runs whatever the game ports did; only the engine has to have built.
    if: ${{ !cancelled() && needs.engine.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.key.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: libxash
          path: dist
      # No game-* artifacts at all (every port failed or was skipped) is fine.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: game-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          shasum -a 256 -- *.a | tee SHA256SUMS
      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          games=(libgame-*.a)
          gh release create "$TAG" libxash.a libxash-sim.a "${games[@]}" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Prebuilt libxash ($TAG)" \
            --notes "libxash.a + libxash-sim.a built by the Prebuilt libxash workflow from $GITHUB_SHA, plus the game ports that built: ${games[*]:-none}. Fetched automatically by scripts/fetch-prebuilts.sh; the tag is a content key from scripts/prebuilt-keys.sh."
